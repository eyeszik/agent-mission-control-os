[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freevideoforge"
version = "1.0.0"
description = "Local-first, zero-cost brief-to-video production. No paid API, no credentials, no network at render time."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSES.md" }
keywords = ["video", "ffmpeg", "local-first", "text-to-video", "offline", "captions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
]

# Pillow is the only third-party runtime dependency. FFmpeg is an external
# binary, discovered at runtime rather than linked.
dependencies = ["pillow>=10.1.0"]

[project.optional-dependencies]
# A static ffmpeg for hosts where a system install is not possible. Note this
# wheel ships no ffprobe, so the structural QC gate still wants a real FFmpeg.
static-ffmpeg = ["imageio-ffmpeg>=0.4.9"]
dev = ["pytest>=8.2.0"]

[project.scripts]
freevideoforge = "freevideoforge.cli:main"

[project.urls]
Documentation = "https://github.com/eyeszik/agent-mission-control-os/tree/master/services/freevideoforge"

[tool.hatch.build.targets.wheel]
packages = ["freevideoforge"]

[tool.hatch.build.targets.wheel.force-include]
"freevideoforge/web/index.html" = "freevideoforge/web/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
