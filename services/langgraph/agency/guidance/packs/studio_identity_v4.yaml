    {
      "id": "studio.prompt_compiler",
      "purpose": "Compile complete standalone downstream prompts from canonical project state.",
      "directive_class": "QUALITY_CRITERION",
      "activate_when": {
        "any": [],
        "all": []
      },
      "directives": [
        "Write complete company-specific prompts that can run independently with their declared references.",
        "Repeat essential brand decisions inside each prompt while keeping governance records outside visual render instructions unless operationally necessary.",
        "Specify company, audience, purpose, exact visible copy or text-free instruction, composition, hierarchy, typography, palette, imagery, lighting, materials, dimensions or ratio, reference preservation, medium-specific constraints, acceptance criteria, and handoff expectations as applicable.",
        "Adapt prompts by modality: image prompts describe visible composition; UI prompts include states, responsiveness and token bindings; video prompts include duration, shots, camera, continuity, motion, audio and captions; copy prompts include voice, evidence boundaries and action; print and 3D prompts include production dependencies.",
        "Name required references and readiness state explicitly."
      ],
      "evaluation_criteria": [
        "prompt is self-contained enough for the declared downstream executor",
        "canonical constraints are distinguishable from advisory methodology"
      ],
      "anti_patterns": [
        "provider-specific syntax without verified capability evidence",
        "embedding internal governance narration into render prompts when it does not affect execution"
      ],
      "evidence_requirements": [
        "provider-specific features require current capability evidence"
      ],
      "output_targets": [
        "generic master prompt",
        "verified provider adaptation"
      ],
      "patterns": {},
      "dimensions": [],
      "possible_outputs": [
        "generic master prompt",
        "verified provider adaptation"
      ],
      "subsections": {},
      "directive_targets": [
        "production",
        "quality",
        "governance"
      ]
    },
    {
      "id": "studio.engineering_operations",
      "purpose": "Make implementation guidance production-aware without converting design methodology into runtime authority.",
      "directive_class": "ADVISORY_METHOD",
      "activate_when": {
        "any": [
          "implement",
          "implementation",
          "code",
          "development",
          "react",
          "next.js",
          "python",
          "api",
          "integration"
        ],
        "all": []
      },
      "directives": [
        "Verify actual tools, packages, versions, and project conventions before prescribing implementation.",
        "Use semantic HTML or native equivalents, appropriate accessibility patterns, governed token bindings, and required responsive, locale, direction, and motion settings.",
        "Set performance budgets for actual platforms and important user paths, then inspect script, media, font, rendering, network, battery, responsiveness, and layout stability as applicable.",
        "Trace meaningful tests to acceptance criteria and distinguish editable source, preview, implementation, and production exports.",
        "Treat telemetry as authorized measurement, distinguish usage from quality and correlation from causation, and minimize collected data."
      ],
      "evaluation_criteria": [
        "implementation claims are backed by executed checks",
        "platform constraints are verified rather than assumed"
      ],
      "anti_patterns": [
        "claiming tool or package support without inspection",
        "treating a design specification as proof of runtime behavior"
      ],
      "evidence_requirements": [
        "changing package, API, and platform claims require current verification"
      ],
      "output_targets": [
        "implementation plan",
        "verification plan"
      ],
      "patterns": {},
      "dimensions": [],
      "possible_outputs": [
        "implementation plan",
        "verification plan"
      ],
      "subsections": {},
      "directive_targets": [
        "engineering",
        "governance",
        "quality"
      ]
    },
    {
      "id": "studio.versioning_handoff",
      "purpose": "Preserve approved state and invalidate dependent outputs when upstream decisions change.",
      "directive_class": "ADVISORY_METHOD",
      "activate_when": {
        "any": [
          "version",
          "migration",
          "handoff",
          "shared system",
          "component",
          "token",
          "deprecated"
        ],
        "all": []
      },
      "directives": [
        "Version material changes and preserve the last approved state.",
        "Record changed decisions, affected assets, dependencies, downstream revalidation, migration, deprecation, and rollback concerns.",
        "Use actual common ancestry and diffs when merging versioned branches.",
        "Keep experimental assets separate from approved core assets."
      ],
      "evaluation_criteria": [
        "downstream consumers can identify whether revalidation is required"
      ],
      "anti_patterns": [
        "silently mutating approved shared-system behavior"
      ],
      "evidence_requirements": [],
      "output_targets": [
        "handoff record",
        "migration plan"
      ],
