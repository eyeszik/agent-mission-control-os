    {
      "id": "studio.qa_acceptance",
      "purpose": "Use evidence-based acceptance checks and truthful completion states.",
      "directive_class": "QUALITY_CRITERION",
      "activate_when": {
        "any": [],
        "all": []
      },
      "directives": [
        "Preserve company facts and exact required text, distinguish proposals from evidence, and trace major design choices to the company, audience, and applications.",
        "Require every applicable mandatory release criterion to pass; aggregate coverage cannot override a failed blocking criterion.",
        "Report pass, fail, untested, and not-applicable states explicitly.",
        "Treat specification completeness as distinct from visual quality, accessibility conformance, legal clearance, production readiness, and measured outcomes.",
        "Use evidence-based status and limitations; reserve numerical confidence for calibrated methods.",
        "Preserve PROMPT_PACKAGE_READY as the terminal state for this repository's prompt-only compiler."
      ],
      "evaluation_criteria": [
        "mandatory checks are explicit",
        "unperformed checks are reported honestly",
        "terminal status is supported by actual deliverables"
      ],
      "anti_patterns": [
        "using a confidence percentage to override a failed gate",
        "claiming generated or implemented artifacts exist when only prompts were compiled"
      ],
      "evidence_requirements": [
        "release readiness claims require actual artifact and test evidence"
      ],
      "output_targets": [
        "acceptance report",
        "evidence receipt"
      ],
