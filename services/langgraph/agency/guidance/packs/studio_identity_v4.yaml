  "sections": [
    {
      "id": "studio.project_contract",
      "purpose": "Compile a bounded project contract before creative expansion.",
      "directive_class": "ADVISORY_METHOD",
      "activate_when": {
        "any": [],
        "all": []
      },
      "directives": [
        "Derive objective, business category, audience, user job, market, channels, platforms, locales, scope, constraints, existing assets, protected decisions, deliverables, and acceptance criteria.",
        "Record explicit non-goals and avoid expanding a focused design task into unrelated enterprise architecture.",
        "Preserve exact required spelling, punctuation, capitalization, diacritics, and script.",
        "Separate company facts from proposed positioning, audiences, values, taglines, and visual choices.",
        "Proceed with labeled reversible proposals when missing information does not materially change a binding or irreversible decision."
      ],
      "evaluation_criteria": [
        "project scope is explicit",
        "protected decisions are preserved",
        "unknown facts remain unresolved rather than invented"
      ],
      "anti_patterns": [
        "silently promoting proposals into company facts",
        "expanding scope without a project need"
      ],
      "evidence_requirements": [
        "claims attributed to source material are used only after the relevant source has been inspected"
      ],
      "output_targets": [
        "project contract",
        "completed brand brief"
      ],
      "patterns": {},
      "dimensions": [],
      "possible_outputs": [
        "project contract",
        "completed brand brief"
      ],
      "subsections": {},
      "directive_targets": [
        "strategy",
        "governance"
      ]
    },
    {
      "id": "studio.identity_system",
      "purpose": "Translate strategy into a context-specific identity system.",
      "directive_class": "ADVISORY_METHOD",
      "activate_when": {
        "any": [],
        "all": []
      },
      "directives": [
        "Prioritize contextual fitness over universal styles and derive aesthetic decisions from brand meaning, audience, and application context.",
        "Define one coherent creative direction by default with a thesis, observable meaning-to-form decisions, and a brand-specific signature behavior.",
        "Specify useful logo lockups, reduction behavior, typography roles, color roles, layout hierarchy, imagery rules, motion purpose, and voice behavior only to the depth required by the deliverable.",
        "Treat spacing scales, typography limits, motion timings, and aesthetic conventions as contextual heuristics unless adopted into a higher-authority project contract.",
        "Keep experimental campaign devices separate from durable core identity."
      ],
      "evaluation_criteria": [
        "distinctive behavior survives removal of fashionable effects",
        "visual decisions trace to company, audience, and applications",
        "identity rules are implementable at the requested scale"
      ],
      "anti_patterns": [
        "universalizing an 8-point grid or any single aesthetic",
        "equating visual distinctiveness with legal clearance",
        "using decoration, motion, or 3D without communicative purpose"
      ],
      "evidence_requirements": [],
      "output_targets": [
        "identity system",
        "creative direction"
      ],
      "patterns": {},
      "dimensions": [],
      "possible_outputs": [
        "identity system",
        "creative direction"
      ],
      "subsections": {},
      "directive_targets": [
        "visual",
        "composition",
        "typography",
        "motion"
      ]
    },
    {
      "id": "studio.trend_intelligence",
      "purpose": "Use current design trends as scoped, reversible evidence rather than brand authority.",
      "directive_class": "EVIDENCE_BOUND_ADVISORY",
      "activate_when": {
        "any": [
          "trend",
          "trends",
          "current",
          "emerging",
          "fashionable",
          "contemporary"
        ],
        "all": []
      },
      "directives": [
        "Scope every trend observation to geography, industry, audience, channel, and observation window.",
        "Classify lifecycle as weak signal, emerging, accelerating, mainstream, saturated, declining, reviving, seasonal, durable pattern, or unknown.",
        "Evaluate user benefit, novelty loss, accessibility, performance, cultural fit, saturation, implementation cost, reversibility, and brand differentiation.",
        "Keep trend adoption optional and state what counterevidence would change the decision.",
        "Separate experimental campaign trends from stable identity and component contracts."
      ],
      "evaluation_criteria": [
        "trend evidence is fresh enough for the decision",
        "adoption decision is reversible where uncertainty is material"
      ],
      "anti_patterns": [
        "treating popularity as strategic fit",
        "promoting a trend directly into BrandCore"
      ],
      "evidence_requirements": [
        "material trend claims require current source references and an observation window"
      ],
      "output_targets": [
        "trend record",
        "adopt-pilot-watch-reject decision"
      ],
      "patterns": {},
      "dimensions": [],
      "possible_outputs": [
        "trend record",
        "adopt-pilot-watch-reject decision"
      ],
      "subsections": {},
      "directive_targets": [
        "trend",
        "governance"
      ]
    },
    {
      "id": "studio.token_system",
      "purpose": "Compile reusable cross-platform design tokens only when the scope requires a governed system.",
      "directive_class": "ADVISORY_METHOD",
      "activate_when": {
        "any": [
          "design system",
          "token",
          "tokens",
          "component library",
          "ui system",
          "web app",
          "application"
        ],
        "all": []
      },
      "directives": [
        "Use primitive, semantic, and component token tiers and bind implementation through semantic meaning rather than raw visual literals.",
        "Define only required modes such as light, dark, high-contrast, brand, or density modes.",
        "Validate alias cycles, unresolved references, type mismatches, ambiguous semantics, mode gaps, missing platform mappings, undocumented literal overrides, and semantic drift.",
        "Preserve semantic intent across web, iOS, Android, desktop, motion, print, and 3D while documenting legitimate platform differences.",
        "Treat 8/4-unit spacing as a starting heuristic only; prefer content, typography, platform, and validated density needs."
      ],
      "evaluation_criteria": [
        "semantic tokens are platform-independent in meaning",
        "platform adapters document intentional differences"
      ],
      "anti_patterns": [
        "hard-coding one platform token representation as universal",
        "claiming specification compatibility without verifying the target version"
      ],
      "evidence_requirements": [],
      "output_targets": [
        "token architecture",
        "platform mapping"
      ],
      "patterns": {},
      "dimensions": [],
      "possible_outputs": [
        "token architecture",
        "platform mapping"
      ],
      "subsections": {},
      "directive_targets": [
        "tokens",
        "engineering",
        "accessibility"
      ]
    },
    {
      "id": "studio.product_ui_accessibility",
      "purpose": "Apply interaction, component, and accessibility guidance to interfaces and journeys.",
      "directive_class": "ADVISORY_METHOD",
      "activate_when": {
        "any": [
          "ui",
          "ux",
          "interface",
          "product",
          "website",
          "web app",
          "app",
          "accessibility"
        ],
        "all": []
      },
      "directives": [
        "Define component purpose, anatomy, variants, applicable states, semantic tokens, content rules, responsive behavior, accessibility, keyboard behavior, events, platform adapters, and migration concerns.",
        "Include applicable loading, empty, error, success, offline, permission, degraded, partial, and destructive-confirmation states rather than forcing every state onto every component.",
        "Use verified governing accessibility requirements and propose WCAG 2.2 AA for web only when no stronger applicable target is supplied.",
        "Test actual content expansion, script shaping, zoom, reflow, focus order, keyboard operation, non-color meaning, forced colors, screen-reader behavior, reduced motion, localization, RTL, and alternative input where applicable.",
        "Describe accessibility conformance evidence separately from general usability evidence."
      ],
      "evaluation_criteria": [
        "critical user paths remain operable without pointer-only input",
        "reduced-motion alternatives preserve information and causality"
      ],
      "anti_patterns": [
        "claiming conformance from specification completeness alone",
        "waiving accessibility for aesthetic preference"
      ],
      "evidence_requirements": [
        "release-level accessibility claims require executed checks on the actual artifact"
      ],
      "output_targets": [
        "component contract",
        "accessibility test matrix"
      ],
      "patterns": {},
      "dimensions": [],
      "possible_outputs": [
        "component contract",
        "accessibility test matrix"
      ],
      "subsections": {},
      "directive_targets": [
        "interaction",
        "accessibility",
        "quality"
      ]
    },
    {
      "id": "studio.ai_experience",
      "purpose": "Model AI product behavior according to consequence and reversibility.",
      "directive_class": "ADVISORY_METHOD",
      "activate_when": {
        "any": [
          "ai",
          "agent",
          "assistant",
          "copilot",
          "delegated",
          "automation"
        ],
        "all": []
      },
      "directives": [
        "Activate AI experience controls only when the designed product contains AI functionality, not merely because AI creates design assets.",
        "Select disclosure, provenance, editing, retry, accept-reject, cancel, undo, action history, approval, and recovery controls according to consequence and reversibility.",
        "For delegated actions expose scope, progress, cancellation, action records, and recovery; for consequential actions provide material preview, authorization, appropriate approval, human override, and recovery or compensation.",
        "Use numeric confidence only when a valid measurement method supports it.",
        "Verify cancellation and recovery behavior before representing those controls as functional."
      ],
      "evaluation_criteria": [
        "trust controls match consequence level",
        "delegated state transitions are understandable"
      ],
      "anti_patterns": [
        "displaying unsupported confidence percentages",
        "presenting decorative cancel or rollback controls as operational"
      ],
      "evidence_requirements": [],
      "output_targets": [
        "AI experience contract",
        "delegated-action state model"
      ],
      "patterns": {},
      "dimensions": [],
      "possible_outputs": [
        "AI experience contract",
        "delegated-action state model"
      ],
      "subsections": {},
      "directive_targets": [
        "interaction",
        "governance",
        "accessibility"
      ]
    },
    {
      "id": "studio.asset_catalog",
      "purpose": "Choose the smallest sufficient asset family and preserve dependency order.",
      "directive_class": "ADVISORY_METHOD",
      "activate_when": {
        "any": [],
        "all": []
      },
      "directives": [
        "Honor explicitly requested assets; otherwise prioritize the smallest set that establishes identity masters before dependent visuals.",
        "Record each asset's purpose, priority, channel, format, dimensions or ratio, required copy, dependencies, creation method, and acceptance checks.",
        "Name missing reference dependencies explicitly and do not count partially specified prompts as delivered.",
        "Separate core identity masters from campaign, product, environment, imagery, motion, and verbal applications."
      ],
      "evaluation_criteria": [
        "dependent assets reference the appropriate identity master",
        "asset selection is proportional to requested scope"
      ],
      "anti_patterns": [
        "generating a fixed catalog regardless of context",
        "counting prompt titles or placeholders as complete prompts"
      ],
      "evidence_requirements": [],
      "output_targets": [
        "prioritized asset plan"
      ],
      "patterns": {},
      "dimensions": [],
