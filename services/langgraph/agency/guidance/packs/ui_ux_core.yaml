{
  "id": "pg.ui_ux.core",
  "schema_version": "1.0.0",
  "pack_version": "1.0.0",
  "domain": "UI_UX",
  "guidance_class": "METHODOLOGY",
  "authority_class": "ADVISORY",
  "description": "Advisory UI/UX methodology for PromptFamily.UI_UX packages. Complements the deterministic UI/UX compiler (agency/ui_ux): the compiler produces the governed spec; this pack shapes how the spec is expressed in a generation prompt. It cannot redefine WCAG 2.2 conformance, DTCG token semantics, brand state, permissions, or terminal states.",
  "activation": {
    "asset_families": [
      "UI_UX"
    ],
    "asset_types": [
      "landing page",
      "web app",
      "dashboard",
      "ai interface",
      "assistant",
      "onboarding flow",
      "checkout",
      "product ui",
      "screen",
      "component",
      "design system"
    ],
    "channels": [
      "web",
      "app",
      "mobile",
      "desktop",
      "product"
    ],
    "brand_domains": [
      "visual",
      "verbal",
      "motion"
    ],
    "capabilities": [
      "UI_GENERATION",
      "CODE_GENERATION"
    ],
    "task_tags": [
      "ui",
      "ux",
      "interface",
      "screen",
      "flow",
      "usability",
