  "description": "Evidence-bound attention and hook methodology for advertising, social, short-form video openings, titles, thumbnails, OOH and email subject lines. Principles are generalized operational guidance; performance language is gated on measured evidence. It activates only for attention surfaces and never rewrites general brand copy, BrandCore, claims status, or approvals.",
