  "description": "Physical and cross-medium production methodology for compiling visual, print, packaging, signage, merchandise, and email deliverables from a canonical brand system: visual grammar, metaphor-driven identity translation, anti-generic quality control, color modeled as a semantic production token rather than a single hex value, application-family hierarchy, and medium-specific production preflight knowledge. Extends pg.studio_identity.v4's cross-modal prompt compiler with the physical-production dependencies (dieline, bleed, ICC, verified spot color, real-world scale, fabrication spec) that a rendered image alone cannot supply.",
