{
  "id": "pg.copy_content.v1",
  "schema_version": "1.0.0",
  "pack_version": "1.0.0",
  "domain": "COPYWRITING",
  "guidance_class": "METHODOLOGY",
  "authority_class": "ADVISORY",
  "description": "Advisory copywriting, editing, content-design and content-strategy methodology for COPY-family prompt packages, extracted from the Universal Brand/Content/Visual Prompt OS v10 specification. Minimum-sufficient: only the base copy rules always apply; framework, messaging, long-form, UX-writing, SEO, repurposing and rewrite-preservation sections activate from request terms. It cannot redefine BrandCore voice, verified evidence, claims status, or terminal states.",
