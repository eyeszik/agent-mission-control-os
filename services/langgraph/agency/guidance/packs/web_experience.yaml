  "authority_class": "ADVISORY",
  "description": "Advisory methodology for landing pages and marketing sites built as React/Next.js code: design tokens first, purposeful Framer Motion (scroll-triggered fades, staggered reveals, hover transitions), production UI blocks sourced from 21st.dev and adapted to the brand, section-by-section construction and a measured Lighthouse audit. The premise that static pages read as generic is treated as a design hypothesis, not a fact. This pack cannot redefine tokens, WCAG 2.2 conformance, brand state, zero-fabrication rules, permissions or terminal states.",
