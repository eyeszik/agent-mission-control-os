[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amc-langgraph"
version = "0.2.0"
description = "Agent Mission Control LangGraph Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "vaderSentiment>=3.3.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]
# Local visual engine (docs/local-visual-engine.md). Pillow decodes PNG renders for verification;
# bpy is Blender as a Python module (wheels exist for CPython 3.11 only). FFmpeg is a system package.
visual = ["Pillow>=10.0", "bpy==4.2.0; python_version == '3.11'"]

[tool.hatch.build]
include = ["agency/guidance/packs/*.yaml", "agency/compiled/data/*.json"]

[tool.hatch.build.targets.wheel]
packages = ["app", "api", "agency", "core", "graph", "persistence", "quality", "security", "integrations"]
