[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amc-langgraph"
version = "0.2.0"
description = "Agent Mission Control LangGraph Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "vaderSentiment>=3.3.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["app", "api", "graph", "persistence", "quality", "security", "integrations"]
