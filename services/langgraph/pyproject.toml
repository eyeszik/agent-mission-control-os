[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amc-langgraph"
version = "0.1.0"
description = "Agent Mission Control LangGraph Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]
