name: E2E Dependency Bootstrap

on:
  push:
    branches: ["feat/browser-e2e-release-gate"]

permissions:
  contents: write

jobs:
  pin-playwright:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-e2e-release-gate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - uses: pnpm/action-setup@v4

      - name: Generate lockfile for pinned browser test dependency
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @amc/web add -D @playwright/test@1.61.0

      - name: Commit generated dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin Playwright browser test dependency"
            git push origin HEAD:feat/browser-e2e-release-gate
          fi
