name: ACE one-time audited lockfile generation

on:
  push:
    branches: [fix/ace-v100-ci-and-integration-gates]
    paths:
      - .github/workflows/ace-one-shot-locksync.yml

permissions:
  contents: write

concurrency:
  group: ace-locksync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'eyeszik/agent-mission-control-os' && github.ref == 'refs/heads/fix/ace-v100-ci-and-integration-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Generate dependency lockfile from real npm metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Validate intended dependency and changed paths
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'@tailwindcss/postcss@4.3.3'" pnpm-lock.yaml
          test "$(git diff --name-only | grep -v '^pnpm-lock.yaml$' | wc -l)" -eq 0
      - name: Commit lockfile on remediation branch only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(deps): regenerate pinned Tailwind v4 lockfile'
            git push origin HEAD:fix/ace-v100-ci-and-integration-gates
          fi
