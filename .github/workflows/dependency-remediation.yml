name: Dependency Remediation

on:
  push:
    branches: ["remediate/drrpc-production-hardening"]

permissions:
  contents: write

jobs:
  update-web-dependencies:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediate/drrpc-production-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4

      - name: Resolve patched web dependency graph
        shell: bash
        run: |
          set -uo pipefail
          pnpm install --frozen-lockfile
          node - <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (pkg.scripts?.lint === 'next lint') delete pkg.scripts.lint;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm --filter @amc/web add next@16.3.0
          pnpm audit --fix --prod || true
          audit_status=0
          pnpm audit --prod --audit-level high || audit_status=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: upgrade Next.js to audited 16.3 line"
            git push origin HEAD:remediate/drrpc-production-hardening
          fi

          exit "$audit_status"
