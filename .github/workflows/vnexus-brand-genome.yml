name: VNEXUS Brand Genome Validation
on:
  pull_request:
    paths:
      - 'apps/web/lib/design/brand-genome.ts'
      - 'apps/web/tests/brand-genome.test.ts'
      - '.github/workflows/vnexus-brand-genome.yml'
  workflow_dispatch:
jobs:
  genome-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # The repository's Actions policy rejects the third-party pnpm setup action; use the exact pin from package.json.
      - name: Enable repository-pinned pnpm (Node-bundled corepack, exact version + SHA-512)
        run: |
          pnpm_spec="$(node -e 'const p=require("./package.json").packageManager; if(typeof p!=="string"||!/^pnpm@\d+\.\d+\.\d+\+sha512\.[a-f0-9]{128}$/.test(p))throw new Error("Expected exact pnpm version and SHA-512 pin"); process.stdout.write(p)')"
          corepack enable
          corepack prepare "$pnpm_spec" --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (apps/web imports their dist output)
        run: pnpm --filter "./packages/*" build
      - name: VNEXUS unit tests
        run: pnpm --filter @amc/web exec vitest run tests/brand-genome.test.ts
      - name: Web typecheck
        run: pnpm --filter @amc/web typecheck
