name: CI

on:
  push:
    branches: [master, "remediate/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile + invariants + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install -e "./services/langgraph[dev]"

      - name: Verify repository invariants
        run: python scripts/verify_repository_invariants.py

      - name: Verify production readiness invariants
        run: python scripts/verify_production_readiness.py

      - name: Verify auth and hosting bindings (auth-bind-check)
        run: python scripts/verify_auth_bindings.py

      - name: Verify N1/N2 ontology parity across Python and TypeScript
        run: python scripts/verify_ontology_parity.py

      - name: Verify frontend consumes design tokens, not raw colors
        run: python scripts/verify_design_tokens.py

      - name: Verify integrity manifest
        run: python scripts/verify_manifest.py

      - name: Verify prompt guidance registry
        run: python scripts/verify_guidance_registry.py

      - name: Compile Python sources
        run: python -m compileall -q services/langgraph scripts

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Run backend tests
        env:
          AMC_DATABASE_BACKEND: sqlite
          AMC_DB_PATH: /tmp/amc_ci_${{ github.run_id }}.db
          AMC_EXPORT_ROOT: /tmp/amc-exports-${{ github.run_id }}
        run: |
          set -o pipefail
          python -m pytest services/langgraph/tests -q -rf --junitxml=/tmp/junit-sqlite.xml 2>&1 | tee /tmp/pytest-sqlite.log

      - name: Summarize failing tests (last 100 lines of pytest output)
        if: failure()
        run: |
          {
            echo "### backend pytest output (last 100 lines)"
            echo '```'
            tail -n 100 /tmp/pytest-sqlite.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit results on failure
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-sqlite-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/junit-sqlite.xml
          if-no-files-found: warn
          retention-days: 7

  backend-postgres:
    name: Backend on PostgreSQL (migrations + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amc
          POSTGRES_PASSWORD: amc
          POSTGRES_DB: amc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amc -d amc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install -e "./services/langgraph[dev]"

      - name: Apply Supabase stand-ins and every production migration in order
        env:
          PGPASSWORD: amc
        run: |
          psql -h 127.0.0.1 -U amc -d amc_test -v ON_ERROR_STOP=1 -q -f supabase/ci/supabase_shim.sql
          for migration in supabase/migrations/*.sql; do
            echo "applying $migration"
            psql -h 127.0.0.1 -U amc -d amc_test -v ON_ERROR_STOP=1 -q -f "$migration"
          done

      - name: Run backend tests against PostgreSQL
        # Bounded, but sized from measurement: the same suite takes ~17 minutes
        # on SQLite in CI and 27 minutes locally, so 20 was a cap on ordinary
        # work and turned a slow suite into "timed out, no report". This cap
        # exists only to stop an unbounded lock wait from holding the job open.
        timeout-minutes: 45
        env:
          AMC_DATABASE_BACKEND: postgres
          DATABASE_URL: postgresql://amc:amc@127.0.0.1:5432/amc_test
          AMC_EXPORT_ROOT: /tmp/amc-exports-pg-${{ github.run_id }}
        run: |
          set -o pipefail
          python -m pytest services/langgraph/tests -q -rf --junitxml=/tmp/junit-pg.xml 2>&1 | tee /tmp/pytest-pg.log

      - name: Summarize failing tests (last 100 lines of pytest output)
        if: failure()
        run: |
          {
            echo "### backend-postgres pytest output (last 100 lines)"
            echo '```'
            tail -n 100 /tmp/pytest-pg.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failing tests as annotations
        if: failure()
        env:
          # When the step above is killed by its own timeout it writes no junit
          # at all; the pytest output is the only evidence and it is raised from
          # here instead of being left in an unreachable log.
          AMC_FAILURE_LOG: /tmp/pytest-pg.log
        run: python .github/scripts/annotate-junit-failures.py /tmp/junit-pg.xml

      - name: Upload JUnit results on failure
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-postgres-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/junit-pg.xml
          if-no-files-found: warn
          retention-days: 7

  backend-council:
    name: Mission Council engines (CrewAI + AutoGen + MCP, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend with the council extra
        # Constraints pin the council extra to the versions resolved and tested locally.
        run: python -m pip install -e "./services/langgraph[dev,council]" -c services/langgraph/constraints-council.txt

      - name: Verify installed dependency consistency
        run: python -m pip check

      # Every engine runs on the deterministic mock model: no key, no network.
      - name: Run mission council tests on all three engines
        env:
          AMC_DATABASE_BACKEND: sqlite
          AMC_DB_PATH: /tmp/amc_council_${{ github.run_id }}.db
          AMC_EXPORT_ROOT: /tmp/amc-council-exports-${{ github.run_id }}
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
        run: |
          set -o pipefail
          python -m pytest -q -rf --junitxml=/tmp/junit-council.xml \
          services/langgraph/tests/test_missions_council.py \
          services/langgraph/tests/test_council_engines.py \
          services/langgraph/tests/test_council_gateway.py \
          services/langgraph/tests/test_council_ported_scenarios.py \
          services/langgraph/tests/test_council_contracts.py 2>&1 | tee /tmp/pytest-council.log

      - name: Summarize failing tests (last 100 lines of pytest output)
        if: failure()
        run: |
          {
            echo "### backend-council pytest output (last 100 lines)"
            echo '```'
            tail -n 100 /tmp/pytest-council.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The MCP tests fail closed by refusing a server whose command or file
      # arguments are not pinnable: not absolute, missing, group- or world-writable,
      # or not matching their sha256. The tests report only "not on the tool
      # allowlist", so report the runner's actual condition here, where it is a
      # property of the machine rather than of the test.
      - name: Report MCP pin preconditions on this runner
        if: failure()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, stat, sys
          from pathlib import Path

          root = Path.cwd()
          server = (root / 'services/langgraph/tests/fixtures/council_mcp_server.py').resolve()
          print('### MCP pin preconditions')
          print('```')
          for label, path in (('sys.executable', Path(sys.executable)), ('fixture server', server)):
              print(f'{label}: {path}')
              try:
                  mode = os.stat(path).st_mode
                  print(f'  exists: True  mode: {oct(mode & 0o777)}'
                        f'  group-writable: {bool(mode & stat.S_IWGRP)}'
                        f'  world-writable: {bool(mode & stat.S_IWOTH)}'
                        f'  is-file: {path.is_file()}')
              except OSError as exc:
                  print(f'  stat failed: {exc}')
          print(f'cwd: {root}')
          print(f'cwd writable-by-others: {bool(os.stat(root).st_mode & stat.S_IWOTH)}')
          print('```')
          PY

      # Failing test names are emitted as annotations, not only inside the log or the
      # artifact. Both of those are served from a blob host, so a reviewer without log
      # access sees an unhelpful "Process completed with exit code 1" and cannot tell
      # which test failed. Annotations come from the API and name the test.
      - name: Publish failing council tests as annotations
        if: failure()
        run: python .github/scripts/annotate-junit-failures.py /tmp/junit-council.xml

  frontend:
    name: Frontend (contracts + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"

      - name: Enable pnpm via corepack (pin-verified from package.json packageManager)
        run: |
          npm install --global corepack@latest --no-audit --no-fund
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @amc/shared build

      - name: Typecheck shared package
        run: pnpm --filter @amc/shared typecheck

      - name: Test shared package
        run: pnpm --filter @amc/shared test

      # Tier-1 workspace packages (@amc/errors, config, logger, constants, db,
      # testing); pnpm runs them in dependency order.
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" --filter "!@amc/shared" build

      - name: Typecheck workspace packages
        run: pnpm --filter "./packages/*" --filter "!@amc/shared" typecheck

      - name: Test workspace packages
        run: pnpm --filter "./packages/*" --filter "!@amc/shared" test

      - name: Typecheck web app
        run: pnpm --filter @amc/web typecheck

      - name: Test web app
        run: pnpm --filter @amc/web test

      - name: Verify UI token consumption (TypeScript AST gate)
        run: pnpm --filter @amc/web verify:ui

      - name: Build web app
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_AUTH_MODE: local
        run: pnpm --filter @amc/web build

  ucpo-sandbox:
    name: UCPO sandboxed build + browser QA (must not skip)
    runs-on: ubuntu-latest
    timeout-minutes: 40  # the Chromium install step alone may take up to 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"

      - name: Enable pnpm via corepack (pin-verified from package.json packageManager)
        run: |
          npm install --global corepack@latest --no-audit --no-fund
          corepack enable
          pnpm --version

      - name: Install application dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e "./services/langgraph[dev]"

      # The sandbox runs Chromium with HOME set to a scratch dir, so browsers live at a fixed path.
      - name: Install Chromium runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
        timeout-minutes: 25
        run: |
          # The runner's apt mirror is occasionally very slow. Let apt retry stalled downloads itself and
          # cap the whole step. Never kill and re-run the installer: an interrupted apt-get keeps the dpkg
          # lock, so every retry would fail immediately.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null
          pnpm --filter @amc/web exec playwright install --with-deps chromium

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; the UCPO sandbox needs them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # A skip here means the sandbox was unavailable, which would hide regressions, so it fails the job.
      - name: Run sandboxed build and browser QA tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
          AMC_DATABASE_BACKEND: sqlite
        run: |
          set -o pipefail  # without it, tee hides a pytest failure
          python -m pytest services/langgraph/tests/test_ucpo_build.py services/langgraph/tests/test_sandbox_mount_nesting.py services/langgraph/tests/test_browser_binary_resolution.py services/langgraph/tests/test_ci_annotation_scripts.py -q -rs --junitxml=/tmp/junit-ucpo.xml | tee /tmp/ucpo-sandbox.log
          if grep -q "SKIPPED" /tmp/ucpo-sandbox.log; then
            echo "::error::UCPO sandbox tests were skipped; the sandbox is not available on this runner"
            exit 1
          fi

      - name: Publish failing tests as annotations
        if: failure()
        run: python .github/scripts/annotate-junit-failures.py /tmp/junit-ucpo.xml

      # The job fails when a UCPO test skips, because a skip means the sandbox or
      # Chromium was unavailable and would hide a regression. Which of the two, and
      # why, is only in the skip reason, so print the probe's own verdict here.
      # The job fails when a UCPO test skips, because a skip means the sandbox or
      # Chromium was unavailable and would hide a regression. Which of the two, and
      # why, is only in the skip reason, so print the probe's own verdict here. Every
      # branch reports through an annotation, including an import failure, so the job
      # never fails silently on the one step meant to explain it.
      - name: Report sandbox and browser preconditions on this runner
        if: failure()
        run: |
          python - <<'PY'
          import json
          import traceback

          def emit(level, title, message):
              message = ' '.join(str(message).split())[:400]
              print(f'::{level} title={title}::{message}')

          try:
              from services.langgraph.agency.ucpo.sandbox import probe_isolation
              from services.langgraph.agency.ucpo import qa
              import os
              iso = probe_isolation()
              print('sandbox available:', iso.available)
              print('sandbox reasons  :', list(iso.reasons))
              print('sandbox facts    :', json.dumps(iso.facts, default=str))
              root, cache, module = qa._playwright_paths()
              print('playwright root  :', root)
              print('browser cache    :', cache, 'exists:', bool(cache and os.path.isdir(cache)))
              print('playwright module:', module)
              emit('warning', 'UCPO sandbox available', iso.available)
              for reason in iso.reasons:
                  emit('error', 'UCPO sandbox reason', reason)
              if not iso.available and not iso.reasons:
                  emit('error', 'UCPO sandbox', 'probe reported unavailable with no reason')
          except Exception:
              emit('error', 'UCPO diagnostic failed', traceback.format_exc().strip().splitlines()[-1])
              traceback.print_exc()
          PY

      # AVIC renders through the same local Chromium; its browser tests must run here, not skip.
      - name: Run AVIC, brand book and creative-direction render, release and API tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
          AMC_DATABASE_BACKEND: sqlite
          # A private database per job: the default path is shared with the other
          # pytest steps and SQLite's write lock turns that into collection errors.
          AMC_DB_PATH: /tmp/amc-avic-${{ github.run_id }}.db
        run: |
          set -o pipefail
          python -m pytest services/langgraph/tests/test_avic.py services/langgraph/tests/test_avic_api.py services/langgraph/tests/test_avic_contracts.py services/langgraph/tests/test_vnexus_brandbook.py services/langgraph/tests/test_vnexus_brandbook_contracts.py services/langgraph/tests/test_vnexus_directions.py services/langgraph/tests/test_vnexus_directions_contracts.py -q -rs --junitxml=/tmp/junit-avic.xml | tee /tmp/avic.log
          if grep -q "SKIPPED" /tmp/avic.log; then
            echo "::error::AVIC, brand book or creative-direction browser tests were skipped; Chromium is not available to the renderer on this runner"
            exit 1
          fi

      # A failing test name is otherwise only in the blob-hosted log, which is not
      # reachable from every reviewer, so publish it through the API as well.
      - name: Publish failing AVIC tests as annotations
        if: failure()
        run: python .github/scripts/annotate-junit-failures.py /tmp/junit-avic.xml

      # Which precondition broke, and the browser the renderer actually resolved,
      # so a render failure can be told apart from a missing dependency.
      - name: Report AVIC render preconditions on this runner
        if: failure()
        run: |
          python - <<'PY'
          import json
          import traceback


          def emit(level, title, message):
              print(f'::{level} title={title}::{" ".join(str(message).split())[:400]}')


          try:
              from services.langgraph.agency.visual.browser import probe_browser
              probe = probe_browser()
              print('browser probe:', json.dumps(probe, default=str))
              emit('warning', 'AVIC browser available', probe.get('available'))
              for blocker in probe.get('blockers', []):
                  emit('error', 'AVIC browser blocker', blocker)
              # A probe only proves the executable exists. Actually render one tiny
              # SVG through the same boundary so the browser's own exit code and
              # stderr are reported, instead of a bare BROWSER_EXIT in a test.
              from pathlib import Path as _Path
              import tempfile
              from services.langgraph.agency.visual.browser import rasterize_svg, render_pdf, measure_layout
              with tempfile.TemporaryDirectory() as tmp:
                  run = rasterize_svg(
                      '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8">'
                      '<rect width="8" height="8" fill="#0af"/></svg>',
                      width=8, height=8, out_dir=_Path(tmp) / 'raster', timeout_s=90)
                  print('raster:', json.dumps(run, default=str)[:1200])
                  emit('warning' if run.get('status') == 'PASSED' else 'error',
                       'AVIC isolated raster', f"status={run.get('status')} exit={run.get('exit_code')} "
                       f"stderr={str(run.get('stderr_tail'))[:300]}")
                  # The brand book needs print-to-PDF and layout measurement, not
                  # just SVG rasterization. Exercise both so a failure names which
                  # capability is missing instead of showing an empty pdf field.
                  page = ('<html><body style="margin:0"><div data-page="p1" '
                          'style="width:200px;height:120px;font:12px sans-serif">'
                          'printable</div></body></html>')
                  from services.langgraph.agency.visual.browser import chromium_path, headless_shell_for
                  exe = chromium_path()
                  shell = headless_shell_for(exe)
                  print('browser exe  :', exe)
                  print('headless shell:', shell)
                  emit('warning', 'AVIC print binary', f"exe={exe} shell={shell}")
                  import glob
                  import os
                  import shutil
                  roots = [os.environ.get('PLAYWRIGHT_BROWSERS_PATH'), '/home/runner/pw-browsers',
                           os.path.expanduser('~/.cache/ms-playwright')]
                  found = []
                  for root in [r for r in roots if r]:
                      exists = os.path.isdir(root)
                      entries = sorted(os.listdir(root))[:12] if exists else []
                      print('cache root:', root, 'exists:', exists, 'entries:', entries)
                      if exists:
                          found.append(f"{root}: {', '.join(entries)}")
                  emit('warning', 'AVIC browser cache', ' | '.join(found)[:350] if found else 'no cache root found')
                  # A shell anywhere on the machine is still useful evidence,
                  # since the binary is what print actually needs.
                  shells = glob.glob('/home/runner/**/chrome-headless-shell', recursive=True)[:5]
                  print('headless shells found:', shells)
                  emit('warning', 'AVIC headless shells', ', '.join(shells) or 'none found')
                  print('which chromium:', shutil.which('chromium'))
                  emit('warning', 'AVIC chromium on PATH', f"which={shutil.which('chromium')} usr_bin={os.path.exists('/usr/bin/chromium')}")

                  pdf = render_pdf(page, width_px=200, height_px=120, out_dir=_Path(tmp) / 'pdf', timeout_s=90)
                  print('pdf:', json.dumps(pdf, default=str)[:1200])
                  emit('warning' if pdf.get('status') == 'PASSED' else 'error',
                       'AVIC isolated pdf', f"status={pdf.get('status')} exit={pdf.get('exit_code')} "
                       f"findings={pdf.get('findings')} stderr={str(pdf.get('stderr_tail'))[:300]}")
                  lay = measure_layout(page, width=200, height=120, out_dir=_Path(tmp) / 'layout', timeout_s=90)
                  print('layout:', json.dumps(lay, default=str)[:1200])
                  emit('warning' if lay.get('status') == 'PASSED' else 'error',
                       'AVIC isolated layout', f"status={lay.get('status')} exit={lay.get('exit_code')} "
                       f"findings={lay.get('findings')} stderr={str(lay.get('stderr_tail'))[:300]}")
          except Exception:
              emit('error', 'AVIC diagnostic failed', traceback.format_exc().strip().splitlines()[-1])
              traceback.print_exc()
          PY

  render-adapters:
    name: Rendering adapters + video + remote protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
      - name: Enable pnpm via corepack (pin-verified from package.json packageManager)
        run: |
          npm install --global corepack@latest --no-audit --no-fund
          corepack enable
          pnpm --version
      - name: Install exact dependencies and renderer bundles
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @amc/creative-renderer build
          python -m pip install -e "./services/langgraph[dev,rendering]"
      - name: Install Chromium and encoder runtime
        run: |
          pnpm --filter @amc/web exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Fixtures exercise the pinned Remotion license's non-commercial evaluation use.
      - name: Verify all adapters and remote refusal boundaries without skips
        env:
          AMC_DATABASE_BACKEND: sqlite
          AMC_DB_PATH: /tmp/amc-render-adapters.db
        run: |
          set -o pipefail
          python -m pytest services/langgraph/tests/test_rendering.py services/langgraph/tests/test_rendering_media_remote.py -q -rs --junitxml=/tmp/junit-render-adapters.xml | tee /tmp/render-adapters.log
          if grep -q "SKIPPED" /tmp/render-adapters.log; then
            echo "::error::Renderer capability tests skipped; runtime verification is incomplete"
            exit 1
          fi

      - name: Publish failing tests as annotations
        if: failure()
        run: python .github/scripts/annotate-junit-failures.py /tmp/junit-render-adapters.xml

  browser-e2e:
    name: Browser E2E (local degraded HITL)
    runs-on: ubuntu-latest
    timeout-minutes: 40  # the Chromium install step alone may take up to 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"

      - name: Enable pnpm via corepack (pin-verified from package.json packageManager)
        run: |
          npm install --global corepack@latest --no-audit --no-fund
          corepack enable
          pnpm --version

      - name: Install application dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @amc/shared build
          pnpm --filter "./packages/*" --filter "!@amc/shared" build
          python -m pip install -e "./services/langgraph[dev]"

      - name: Install Chromium runtime
        timeout-minutes: 25
        run: |
          # The runner's apt mirror is occasionally very slow. Let apt retry stalled downloads itself and
          # cap the whole step. Never kill and re-run the installer: an interrupted apt-get keeps the dpkg
          # lock, so every retry would fail immediately.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null
          pnpm --filter @amc/web exec playwright install --with-deps chromium

      # The other two jobs that render -- UCPO and the rendering adapters -- both
      # do this, and the sandbox depends on it. Ubuntu 24.04 restricts
      # unprivileged user namespaces through AppArmor, and the AVIC render path
      # probes that boundary before every render: without the relaxation the
      # probe dies at "unshare: write failed /proc/self/uid_map: Operation not
      # permitted", the API correctly reports the renderer BLOCKED, and the
      # Compile button stays disabled for the whole journey. Omitting it here was
      # the reason this job could never pass while the sandboxed jobs did.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Start local stack
        env:
          AMC_ENV: local
          AMC_DATABASE_BACKEND: sqlite
          AMC_AUTH_MODE: local
          AMC_LOCAL_USER_ID: local-e2e
          AMC_LOCAL_TENANT_ID: tenant_1
          AMC_LOCAL_PROJECT_IDS: proj_1
          AMC_LOCAL_ROLE: operator
          AMC_DB_PATH: /tmp/amc_e2e_${{ github.run_id }}.db
          AMC_EXPORT_ROOT: /tmp/amc-exports-${{ github.run_id }}
          AMC_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_AUTH_MODE: local
        run: |
          nohup python -m uvicorn services.langgraph.app.main:app --host 127.0.0.1 --port 8000 > /tmp/amc-backend.log 2>&1 &
          echo $! > /tmp/amc-backend.pid
          # Production build + server: no per-route compile latency during the specs.
          # NEXT_PUBLIC_* values are inlined at build time from this step's env.
          pnpm --filter @amc/web build > /tmp/amc-frontend-build.log 2>&1
          nohup pnpm --filter @amc/web exec next start --hostname 127.0.0.1 --port 3000 > /tmp/amc-frontend.log 2>&1 &
          echo $! > /tmp/amc-frontend.pid

          backend_ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              backend_ready=1
              break
            fi
            sleep 1
          done
          test "$backend_ready" -eq 1

          frontend_ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/mission-control >/dev/null; then
              frontend_ready=1
              break
            fi
            sleep 1
          done
          test "$frontend_ready" -eq 1

          # Every route the specs navigate to is requested once before Playwright
          # starts, so first-hit work is not charged to a test's 60s budget.
          for route in /mission-control /agency /framework /missions /creative; do
            route_ready=0
            for _ in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:3000${route}" >/dev/null; then
                route_ready=1
                break
              fi
              sleep 1
            done
            if [ "$route_ready" -ne 1 ]; then
              echo "::error::route ${route} did not respond after startup"
              exit 1
            fi
          done

      - name: Run browser release smoke
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          echo "Playwright artifacts: apps/web/playwright-report, apps/web/test-results (PNG, WebM, trace.zip)"
          ls -ld apps/web/playwright-report apps/web/test-results 2>/dev/null || true
          # Tee the reporter's own text as well. The junit xml carries the case
          # names but Playwright prints the call log -- the locator it was still
          # waiting on -- only to stdout, and stdout here is a blob-hosted log.
          set -o pipefail
          pnpm --filter @amc/web test:e2e 2>&1 | tee /tmp/playwright-e2e.log

      # Capture diagnostics and artifacts before Stop local stack tears down services.
      - name: Print service logs on failure
        if: failure()
        timeout-minutes: 1
        run: bash .github/scripts/dump-browser-e2e-logs.sh

      # The artifact is unreachable from a reviewer without blob access, so lift
      # the pending locator line out of the JUnit body and into the check run.
      # One annotator, not two: the pytest annotator was being fed this same
      # Playwright report and reported it "missing" under a different name,
      # which is noise on a failure that already had an explanation.
      - name: Publish the pending Playwright step as an annotation
        if: failure()
        run: python .github/scripts/annotate-playwright-junit.py apps/web/junit.xml

      - name: Upload Playwright JUnit results on failure
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/junit.xml
            apps/web/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/browser-e2e.log
            apps/web/playwright-report
            apps/web/test-results
            apps/web/traces
            apps/web/.playwright/artifacts
            playwright-report
            test-results
            traces
            .playwright/artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Stop local stack
        if: always()
        run: |
          test ! -f /tmp/amc-frontend.pid || kill "$(cat /tmp/amc-frontend.pid)" 2>/dev/null || true
          test ! -f /tmp/amc-backend.pid || kill "$(cat /tmp/amc-backend.pid)" 2>/dev/null || true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Audit Python environment
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install -e "./services/langgraph[dev]" pip-audit
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip_audit

      # The optional council extra (CrewAI, AutoGen, MCP), resolved through
      # constraints-council.txt. CrewAI 1.15.37 pins chromadb~=1.5.9, so the four chromadb
      # advisories cannot be upgraded away while CrewAI is installed. None is reachable
      # from the council (docs/mission-council.md, "Dependency advisories"):
      #   PYSEC-2026-311/3813/3814/3815  chromadb server API/RBAC; no Chroma server runs
      #   CVE-2026-59951                 mcp Streamable HTTP server; council uses stdio client
      #   PYSEC-2026-4321                uv CLI TLS roots; nothing runs uv
      # The constraints now resolve mcp 1.30.0 and uv 0.13.7, which carry neither advisory,
      # so those two IDs currently suppress nothing. They are kept so the list stays stable
      # if a resolver change lowers either pin again.
      # Any other advisory in this tree fails the job. Remove an ID once its pin lifts.
      - name: Audit the optional council extra
        run: |
          python -m pip install -e "./services/langgraph[dev,council]" -c services/langgraph/constraints-council.txt
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip_audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln CVE-2026-59951 \
            --ignore-vuln PYSEC-2026-4321

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
      - name: Enable pnpm via corepack (pin-verified from package.json packageManager)
        run: |
          npm install --global corepack@latest --no-audit --no-fund
          corepack enable
          pnpm --version

      - name: Audit production JavaScript dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
