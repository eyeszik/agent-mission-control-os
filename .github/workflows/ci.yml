name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/langgraph
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: .
        env:
          AMC_DB_PATH: /tmp/amc_ci.db
        run: python -m pytest services/langgraph/tests -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @amc/shared build

      - name: Typecheck shared package
        run: pnpm --filter @amc/shared typecheck

      - name: Test shared package
        run: pnpm --filter @amc/shared test

      - name: Typecheck web app
        run: pnpm --filter @amc/web typecheck

      - name: Test web app
        run: pnpm --filter @amc/web test

      - name: Build web app
        run: pnpm --filter @amc/web build
