version: "1.0.0"
status: "draft_until_verified"
runtime_currency_policy: "verify current primary sources when tools permit; otherwise mark verification_unavailable or source_provided"
versions:
  openapi: null
  fastapi: null
  python: null
  uv: null
  pydantic: null
  nextjs: null
  typescript: null
  zod: null
  speakeasy: null
  xstate: null
  mcp: null
  cloudflare_workers: null
  durable_objects: null
  cloudflare_workflows: null
  langgraph: null
  codex: null
  motion: null
  zustand: null
auth:
  secrets_allowed_in_output: false
  least_privilege_required: true
  auth_provider: null
  token_storage_policy: "server_only_or_http_only_cookie_when_implementation_context_known"
pii:
  redaction_required: true
  frontend_raw_pii_allowed: false
  categories:
    - names
    - emails
    - phone_numbers
    - addresses
    - auth_tokens
    - api_keys
    - organization_secrets
    - uploaded_file_sensitive_content
timeouts:
  sse_idle_timeout_ms: null
  mcp_connect_timeout_ms: null
  tool_call_timeout_ms: null
  retry_backoff_policy: "exponential_with_jitter"
acceptance_thresholds:
  min_governance_confidence: 0.65
  min_security_confidence: 0.70
  min_ethics_confidence: 0.70
  min_release_confidence: 0.70
  auto_approve_threshold: 0.85
  standard_threshold: 0.60
  max_retries_per_task: 3
  max_retrieval_iterations: 5
idempotency:
  default_policy: "classify_every_action_as_retry_safe_guarded_retry_or_non_retryable"
  mutation_key_policy: "deterministic_hash_of_tenant_project_user_operation_input_and_client_request_id"
  duplicate_mutation_policy: "return_cached_result_or_block_for_human_review"
streaming:
  default_protocol: "SSE"
  resume_policy: "Last-Event-ID_or_monotonic_cursor"
  duplicate_event_policy: "idempotent_ignore_or_merge"
cloudflare:
  durable_object_policy: "shard_by_tenant_project_run_hash; avoid_global_singleton"
  canonical_state_policy: "database_or_checkpointer_not_durable_object_memory"
  artifact_storage_policy: "object_storage_or_database_not_durable_object_memory"
governance:
  LEG_veto: true
  ETH_veto: true
  SEC_veto: true
  RG_veto: true
  human_review_required_for:
    - irreversible_action
    - external_write
    - credential_or_secret_handling
    - production_deploy
    - regulated_data
    - confidence_below_threshold
    - auditor_dissent
flags:
  - FLAG-REPO-NOT-PROVIDED
  - FLAG-VERSIONS-NULL-UNTIL-REPO-AUDIT
  - FLAG-CLOUDFLARE-BINDINGS-UNVERIFIED
  - FLAG-IMPLEMENTATION-NOT-REQUESTED
